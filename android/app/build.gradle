apply plugin: 'com.android.application'

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('keystore.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def spotifyProperty = project.hasProperty('FORM_SPOTIFY_CLIENT_ID') ? project.property('FORM_SPOTIFY_CLIENT_ID').toString().trim() : ''
def spotifyEnvironment = (System.getenv('FORM_SPOTIFY_CLIENT_ID') ?: '').toString().trim()
if (spotifyProperty && spotifyEnvironment && spotifyProperty != spotifyEnvironment) {
    throw new GradleException('FORM_SPOTIFY_CLIENT_ID project property and environment variable do not match.')
}
def rawSpotifyClientId = spotifyProperty ?: spotifyEnvironment
def spotifyClientIdPattern = /^[0-9a-fA-F]{32}$/
def allowUnconfiguredSpotify = ((project.findProperty('FORM_ALLOW_UNCONFIGURED_SPOTIFY') ?: System.getenv('FORM_ALLOW_UNCONFIGURED_SPOTIFY') ?: '').toString().trim().equalsIgnoreCase('true'))
def releaseRequested = gradle.startParameter.taskNames.any { it.toLowerCase().contains('release') }
if (!(rawSpotifyClientId ==~ spotifyClientIdPattern) && (!allowUnconfiguredSpotify || releaseRequested)) {
    throw new GradleException('A valid 32-character FORM_SPOTIFY_CLIENT_ID is required. Only an explicit debug build with FORM_ALLOW_UNCONFIGURED_SPOTIFY=true may omit it.')
}
def spotifyClientId = (rawSpotifyClientId ==~ spotifyClientIdPattern) ? rawSpotifyClientId : ''

android {
    namespace "com.harsha.form"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.harsha.form"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 8
        versionName "6.0"
        resValue "string", "spotify_client_id", spotifyClientId
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

task verifySpotifyConfiguration {
    doLast {
        println "SPOTIFY_CLIENT_ID_CONFIGURED=${spotifyClientId ? 'true' : 'false'}"
        println "SPOTIFY_UNCONFIGURED_DEBUG_ALLOWED=${spotifyClientId ? 'false' : allowUnconfiguredSpotify.toString()}"
    }
}

tasks.configureEach { task ->
    if (task.name == 'preBuild' || task.name == 'preReleaseBuild') {
        task.dependsOn verifySpotifyConfiguration
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation(name: 'spotify-app-remote-release-0.8.0', ext: 'aar')
    implementation 'com.google.code.gson:gson:2.10.1'
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

name: Android release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the GitHub release
        type: boolean
        default: false
  push:
    tags:
      - v7.0

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      FORM_SPOTIFY_CLIENT_ID: ${{ vars.FORM_SPOTIFY_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify Java version
        run: java -version
      - name: Set up Android SDK
        shell: bash
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="${ANDROID_HOME}/cmdline-tools/16.0/bin/sdkmanager"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0"
      - name: Install dependencies
        run: npm ci
      - name: Validate configuration
        run: |
          test "${#FORM_SPOTIFY_CLIENT_ID}" -eq 32
          echo "$FORM_SPOTIFY_CLIENT_ID" | grep -Eq '^[0-9a-fA-F]{32}$'
          echo "Spotify Client ID supplied: yes"
      - name: Test and sync
        run: |
          node --check www/app.js
          npm test
          npm audit --omit=optional
          npm run sync
      - name: Prepare official Spotify App Remote SDK
        run: npm run prepare:spotify-sdk
      - name: Configure signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Required signing secret $name is missing or empty."
              exit 1
            fi
          done

          WORK_DIR="$(mktemp -d)"
          trap 'rm -rf "$WORK_DIR"' EXIT
          KS="$GITHUB_WORKSPACE/android/app/form-release.jks"

          if ! printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KS"; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not valid Base64."
            exit 1
          fi
          if [ ! -s "$KS" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 decoded to an empty file."
            exit 1
          fi
          MAGIC="$(od -An -tx1 -N2 "$KS" | tr -d ' \n')"
          if [ "$MAGIC" != "3082" ]; then
            echo "::error::Decoded keystore is not a PKCS12 file (unexpected header: $MAGIC)."
            exit 1
          fi

          if ! keytool -list -v -keystore "$KS" -storetype PKCS12 \
              -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" \
              > "$WORK_DIR/keytool.txt" 2> "$WORK_DIR/keytool.err"; then
            echo "::error::The decoded PKCS12 keystore could not be opened with ANDROID_KEYSTORE_PASSWORD and ANDROID_KEY_ALIAS. Verify that ANDROID_KEYSTORE_BASE64 is the production keystore and that the store password and alias secrets match it."
            sed -E 's/(password|storepass|keypass)[^ ]*/\1 [redacted]/Ig' "$WORK_DIR/keytool.err" >&2 || true
            exit 1
          fi
          echo "Keystore: valid PKCS12; alias found; store password accepted."

          printf 'signing probe\n' > "$WORK_DIR/probe.txt"
          jar cf "$WORK_DIR/probe.jar" -C "$WORK_DIR" probe.txt
          if ! jarsigner -keystore "$KS" -storetype PKCS12 \
              -storepass "$ANDROID_KEYSTORE_PASSWORD" -keypass "$ANDROID_KEY_PASSWORD" \
              "$WORK_DIR/probe.jar" "$ANDROID_KEY_ALIAS" \
              > /dev/null 2> "$WORK_DIR/jarsigner.err"; then
            echo "::error::The private key could not be loaded with ANDROID_KEY_PASSWORD. Verify that the key password secret matches the production keystore."
            sed -E 's/(password|storepass|keypass)[^ ]*/\1 [redacted]/Ig' "$WORK_DIR/jarsigner.err" >&2 || true
            exit 1
          fi
          echo "Private key: loaded with the configured key password."

          EXPECTED_SHA256="A5:CD:73:C6:C3:3F:33:EF:F4:05:0E:BE:F7:5A:EA:70:44:AE:81:7F:92:80:2E:71:45:89:B9:8F:6D:BB:1D:84"
          ACTUAL_SHA256="$(awk -F': ' '/SHA256:/{print $2; exit}' "$WORK_DIR/keytool.txt" | tr -d '\r' | tr '[:lower:]' '[:upper:]')"
          if [ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]; then
            echo "::error::Signing certificate SHA-256 fingerprint does not match the production certificate. Expected $EXPECTED_SHA256, got ${ACTUAL_SHA256:-<none>}."
            exit 1
          fi
          echo "Certificate: production SHA-256 fingerprint verified."

          cat > android/keystore.properties <<EOF
          storeFile=$KS
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF
          chmod 600 "$KS" android/keystore.properties
      - name: Build release
        run: npm run build:android -- --release
      - name: Verify release APK
        run: npm run verify
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v7.0') || (github.event_name == 'workflow_dispatch' && inputs.publish)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk FORM-v7.0-android.apk
          gh release create v7.0 FORM-v7.0-android.apk \
            --title "FORM v7.0 — Spotify Reliable Playback" \
            --generate-notes
